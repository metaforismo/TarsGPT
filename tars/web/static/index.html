<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TARS</title>
<style>
  :root { --bg:#0b0e11; --panel:#14181d; --line:#2a313a; --fg:#d7dde4; --acc:#62d0ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 "Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--fg);
         display:grid; grid-template-rows:auto 1fr auto; height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; letter-spacing:4px; margin:0; }
  #status { margin-left:auto; font-size:12px; color:#8b96a3; }
  main { display:grid; grid-template-columns:1fr 270px; gap:0; min-height:0; }
  #chat { overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:9px 13px; border-radius:10px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#1d3a52; }
  .tars { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  aside { border-left:1px solid var(--line); padding:14px; overflow-y:auto; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:2px; color:#8b96a3; margin:14px 0 8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px;
           padding:9px 6px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--acc); color:var(--acc); }
  label { display:flex; justify-content:space-between; font-size:13px; margin-top:8px; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  .cfg { width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--line);
         border-radius:8px; padding:7px 10px; font-size:13px; }
  .cfg:focus { outline:1px solid var(--acc); }
  footer { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  #box { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:8px;
         color:var(--fg); padding:10px 12px; font-size:15px; }
  #box:focus { outline:1px solid var(--acc); }
  .wide { grid-column:1 / -1; }
</style>
</head>
<body>
<header>
  <svg width="22" height="34" viewBox="0 0 22 34"><rect x="1" y="1" width="20" height="32" rx="2"
    fill="none" stroke="#62d0ff" stroke-width="2"/><line x1="6.5" y1="1" x2="6.5" y2="33" stroke="#2a313a"/>
    <line x1="11" y1="1" x2="11" y2="33" stroke="#2a313a"/><line x1="15.5" y1="1" x2="15.5" y2="33" stroke="#2a313a"/></svg>
  <h1 id="name">TARS</h1>
  <button onclick="nextTheme()" style="margin-left:8px" title="Theme">🎨</button>
  <span id="status">connecting…</span>
</header>

<main>
  <div id="chat"></div>
  <aside>
    <h2>Movement</h2>
    <div class="grid">
      <button class="wide" onclick="move('step_forward')">▲ Step forward</button>
      <button onclick="move('turn_left')">◀ Left</button>
      <button onclick="move('pose')">Pose</button>
      <button onclick="move('turn_right')">Right ▶</button>
      <button onclick="move('strafe_left')">⇇ Strafe</button>
      <button onclick="move('neutral')">Neutral</button>
      <button onclick="move('strafe_right')">Strafe ⇉</button>
    </div>
    <h2>Voice</h2>
    <div class="grid">
      <button onclick="voice('start')">Wake on</button>
      <button onclick="voice('stop')">Off</button>
      <button onclick="voice('ptt')">🎤 Talk</button>
      <button class="wide" id="micBtn" onclick="browserMic()">🎙 Browser mic</button>
    </div>
    <h2>Calibration</h2>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <select id="calCh" class="cfg">
        <option value="0">ch0 · lift</option><option value="1">ch1 · port drive</option>
        <option value="2">ch2 · star drive</option><option value="3">ch3</option>
        <option value="4">ch4</option><option value="5">ch5</option>
        <option value="6">ch6</option><option value="7">ch7</option><option value="8">ch8</option>
      </select>
      <input id="calVal" class="cfg" type="number" min="130" max="680" value="350"
             onchange="calDrive(0)">
    </div>
    <div class="grid" style="margin-top:6px">
      <button onclick="calDrive(-10)">−10</button>
      <button onclick="calDrive(-1)">−1</button>
      <button onclick="calDrive(+1)">+1</button>
    </div>
    <div class="grid" style="margin-top:6px;grid-template-columns:1fr 2fr">
      <button onclick="calDrive(+10)">+10</button>
      <select id="calKey" class="cfg"><option value="">save as…</option></select>
    </div>
    <p style="font-size:11px;color:#5b6672;margin-top:6px">⚠ moves the servo live —
      stop before a mechanical limit</p>
    <h2>Knowledge</h2>
    <canvas id="kgCanvas" width="230" height="150"
            style="width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px"></canvas>
    <div id="facts" style="font-size:12px;color:#8b96a3;max-height:110px;overflow-y:auto;margin-top:6px"></div>
    <h2>Gait training</h2>
    <canvas id="spark" width="230" height="48" style="width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px"></canvas>
    <div id="trainInfo" style="font-size:12px;color:#8b96a3"></div>
    <h2>Character</h2>
    <select id="character" onchange="setCharacter()" style="width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px"></select>
    <h2>Personality</h2>
    <label>Humor <span id="humorVal"></span></label>
    <input type="range" id="humor" min="0" max="100" onchange="saveSettings()">
    <label>Honesty <span id="honestyVal"></span></label>
    <input type="range" id="honesty" min="0" max="100" onchange="saveSettings()">
    <label>Sarcasm <span id="sarcasmVal"></span></label>
    <input type="range" id="sarcasm" min="0" max="100" onchange="saveSettings()">
    <h2>Configuration</h2>
    <label style="display:block;margin-bottom:2px">Robot name</label>
    <input type="text" id="cfgName" onchange="saveConfig()" class="cfg">
    <label style="display:block;margin:8px 0 2px">Wake word</label>
    <input type="text" id="cfgWake" onchange="saveConfig()" class="cfg">
    <label style="display:block;margin:8px 0 2px">Language</label>
    <select id="cfgLang" onchange="saveConfig()" class="cfg">
      <option value="en">English</option><option value="it">Italiano</option>
      <option value="es">Español</option><option value="fr">Français</option>
      <option value="de">Deutsch</option><option value="pt">Português</option>
      <option value="ja">日本語</option>
    </select>
    <p style="font-size:11px;color:#5b6672;margin-top:10px">Engines &amp; API keys are set in
      <code>.env</code> — run <code>tars --doctor</code> to verify them.</p>
  </aside>
</main>

<footer>
  <input id="box" placeholder="Say something to TARS… (Enter to send)" autofocus>
  <button onclick="send()">Send</button>
</footer>

<script>
const chat = document.getElementById('chat');
const box = document.getElementById('box');

function add(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function renderImages(div) {
  // turn generated-image paths in TARS replies into inline previews
  const m = div.textContent.match(/\/images\/[\w.-]+\.(png|jpe?g|webp)/g);
  (m || []).forEach(src => {
    const img = document.createElement('img');
    img.src = src;
    img.style.cssText = 'max-width:100%;border-radius:8px;display:block;margin-top:8px';
    div.appendChild(img);
  });
}

async function doLogin() {
  for (;;) {
    const pw = prompt('TARS dashboard password:');
    if (pw === null) return false;
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
                                         body: JSON.stringify({password: pw})});
    if (r.ok) { location.reload(); return true; }
  }
}

async function send() {
  const text = box.value.trim();
  if (!text) return;
  box.value = '';
  add('user', text);
  const pending = add('tars', '…');
  try {
    const r = await fetch('/api/chat/stream', {method:'POST', headers:{'Content-Type':'application/json'},
                                               body: JSON.stringify({message:text})});
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let reply = '', buf = '';
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const ev of events) {
        if (!ev.startsWith('data: ')) continue;
        const data = JSON.parse(ev.slice(6));
        if (data.delta) { reply += data.delta; pending.textContent = reply; chat.scrollTop = chat.scrollHeight; }
      }
    }
    if (!reply) pending.textContent = '(no reply)';
    renderImages(pending);
  } catch (e) { pending.textContent = 'Connection error: ' + e; }
}
box.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function move(action) {
  await fetch('/api/move', {method:'POST', headers:{'Content-Type':'application/json'},
                            body: JSON.stringify({action})});
}
async function voice(cmd) { await fetch('/api/voice/' + cmd, {method:'POST'}); }

let rec = null;
async function browserMic() {
  const btn = document.getElementById('micBtn');
  if (rec) { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    rec = new MediaRecorder(stream);
    const parts = [];
    rec.ondataavailable = e => parts.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      rec = null;
      btn.textContent = '🎙 Browser mic';
      const form = new FormData();
      form.append('audio', new Blob(parts, {type: 'audio/webm'}), 'clip.webm');
      const pending = add('tars', '…');
      try {
        const r = await fetch('/api/voice/chat', {method: 'POST', body: form});
        const data = await r.json();
        if (data.error) { pending.textContent = '⚠ ' + data.error; return; }
        pending.before(Object.assign(document.createElement('div'),
          {className: 'msg user', textContent: data.heard}));
        pending.textContent = data.reply;
        speakInBrowser(data.reply);
      } catch (e) { pending.textContent = 'Connection error: ' + e; }
      chat.scrollTop = chat.scrollHeight;
    };
    rec.start();
    btn.textContent = '⏹ Stop & send';
  } catch (e) { alert('Microphone unavailable: ' + e); }
}

async function speakInBrowser(text) {
  try {
    const r = await fetch('/api/tts', {method:'POST', headers:{'Content-Type':'application/json'},
                                       body: JSON.stringify({text})});
    if (!r.ok) return;
    new Audio(URL.createObjectURL(await r.blob())).play();
  } catch {}
}

async function loadTraining() {
  try {
    const data = await (await fetch('/api/training')).json();
    const entries = data.entries || [];
    const info = document.getElementById('trainInfo');
    const canvas = document.getElementById('spark');
    const g = canvas.getContext('2d');
    g.clearRect(0, 0, canvas.width, canvas.height);
    if (!entries.length) { info.textContent = 'no sessions yet — python -m tars.learn'; return; }
    const rewards = entries.map(e => e.reward);
    const lo = Math.min(...rewards), hi = Math.max(...rewards);
    const x = i => 4 + i * (canvas.width - 8) / Math.max(1, entries.length - 1);
    const y = v => hi === lo ? canvas.height / 2
                             : canvas.height - 6 - (v - lo) * (canvas.height - 12) / (hi - lo);
    const line = (key, color) => {
      g.strokeStyle = color; g.lineWidth = 1.5; g.beginPath();
      entries.forEach((e, i) => i ? g.lineTo(x(i), y(e[key])) : g.moveTo(x(i), y(e[key])));
      g.stroke();
    };
    line('reward', '#3e5566');
    line('best', getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() || '#62d0ff');
    const last = entries[entries.length - 1];
    info.textContent = `best ${last.best} · ${entries.length} evals · ${data.mode} · ${data.started}`;
  } catch {}
}

async function loadHistory() {
  // the conversation survives restarts server-side: restore it in the UI too
  try {
    const data = await (await fetch('/api/memory')).json();
    for (const turn of data.turns || []) {
      const div = add(turn.role === 'user' ? 'user' : 'tars',
                      turn.content.replace(/^\[[^\]]+ is speaking\] /, ''));
      if (turn.role !== 'user') renderImages(div);
    }
  } catch {}
}

async function calDrive(delta) {
  const valBox = document.getElementById('calVal');
  valBox.value = Math.max(130, Math.min(680, (+valBox.value || 350) + delta));
  const saveKey = document.getElementById('calKey').value;
  const r = await fetch('/api/calibrate', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({channel: +document.getElementById('calCh').value,
                          value: +valBox.value, save_as: saveKey || undefined})});
  if (r.ok && saveKey) document.getElementById('calKey').value = '';
}
async function loadCalKeys() {
  try {
    const s = await (await fetch('/api/settings')).json();
    const sel = document.getElementById('calKey');
    sel.innerHTML = '<option value="">save as…</option>' +
      Object.keys(s.pwm || {}).sort().map(k => `<option>${k}</option>`).join('');
  } catch {}
}

function drawKnowledgeGraph(triples) {
  // a tiny force layout: entities are nodes, relations are edges
  const canvas = document.getElementById('kgCanvas');
  const g = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  g.clearRect(0, 0, W, H);
  if (!triples.length) { g.fillStyle = '#5b6672'; g.font = '11px sans-serif';
    g.fillText('no facts yet — tell TARS something worth remembering', 10, H/2); return; }
  const names = [...new Set(triples.flatMap(t => [t.s, t.o]))].slice(0, 18);
  const nodes = names.map((name, i) => ({ name,
    x: W/2 + Math.cos(i*2.39) * (40 + (i%5)*14),
    y: H/2 + Math.sin(i*2.39) * (28 + (i%4)*10), vx:0, vy:0 }));
  const byName = Object.fromEntries(nodes.map(n => [n.name, n]));
  const edges = triples.filter(t => byName[t.s] && byName[t.o])
                       .map(t => [byName[t.s], byName[t.o]]);
  for (let iter = 0; iter < 120; iter++) {           // settle the layout
    for (const a of nodes) for (const b of nodes) {
      if (a === b) continue;
      const dx = a.x-b.x, dy = a.y-b.y, d2 = Math.max(60, dx*dx+dy*dy);
      a.vx += dx/d2*120; a.vy += dy/d2*120;
    }
    for (const [a,b] of edges) {
      const dx = b.x-a.x, dy = b.y-a.y;
      a.vx += dx*0.01; a.vy += dy*0.01; b.vx -= dx*0.01; b.vy -= dy*0.01;
    }
    for (const n of nodes) {
      n.x = Math.max(14, Math.min(W-14, n.x + n.vx)); n.vx *= 0.6;
      n.y = Math.max(12, Math.min(H-12, n.y + n.vy)); n.vy *= 0.6;
    }
  }
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() || '#62d0ff';
  g.strokeStyle = '#2a3540';
  for (const [a,b] of edges) { g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); }
  g.font = '9px sans-serif';
  for (const n of nodes) {
    g.fillStyle = accent; g.beginPath(); g.arc(n.x, n.y, 3, 0, 7); g.fill();
    g.fillStyle = '#aab6c2';
    g.fillText(n.name.slice(0, 14), n.x + 5, n.y + 3);
  }
}

async function loadFacts() {
  try {
    const data = await (await fetch('/api/knowledge')).json();
    const triples = data.triples || [];
    document.getElementById('facts').innerHTML = triples.slice(-15).reverse()
      .map(t => `• ${t.s} <i>${t.r}</i> ${t.o}`).join('<br>') || '(none yet)';
    drawKnowledgeGraph(triples.slice(-30));
  } catch {}
}

async function loadSettings() {
  const s = await (await fetch('/api/settings')).json();
  document.getElementById('name').textContent = s.robot_name;
  for (const k of ['humor','honesty','sarcasm']) {
    document.getElementById(k).value = s[k];
    document.getElementById(k + 'Val').textContent = s[k] + '%';
  }
  document.getElementById('cfgName').value = s.robot_name;
  document.getElementById('cfgWake').value = s.wake_word;
  document.getElementById('cfgLang').value = s.language;
}
async function saveConfig() {
  const body = { robot_name: document.getElementById('cfgName').value.trim(),
                 wake_word: document.getElementById('cfgWake').value.trim().toLowerCase(),
                 language: document.getElementById('cfgLang').value };
  const r = await fetch('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'},
                                          body: JSON.stringify(body)});
  if (r.ok) loadSettings();
}
async function saveSettings() {
  const body = {};
  for (const k of ['humor','honesty','sarcasm']) {
    body[k] = +document.getElementById(k).value;
    document.getElementById(k + 'Val').textContent = body[k] + '%';
  }
  await fetch('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'},
                                body: JSON.stringify(body)});
}
const THEMES = [
  {bg:'#0b0e11', panel:'#14181d', line:'#2a313a', fg:'#d7dde4', acc:'#62d0ff'},  // deep space
  {bg:'#0d0b07', panel:'#1a150c', line:'#3a2f1a', fg:'#e8d9b0', acc:'#ffb347'},  // amber CRT
  {bg:'#070b09', panel:'#0e1713', line:'#1f3a2d', fg:'#cfe8d9', acc:'#4ade80'},  // terminal green
  {bg:'#f4f4f2', panel:'#ffffff', line:'#d4d4d0', fg:'#1d2024', acc:'#0369a1'},  // daylight
];
function applyTheme(i) {
  const t = THEMES[i % THEMES.length];
  for (const [k, v] of Object.entries(t)) document.documentElement.style.setProperty('--' + k, v);
  localStorage.setItem('tars_theme', i % THEMES.length);
}
function nextTheme() { applyTheme((+localStorage.getItem('tars_theme') || 0) + 1); }
applyTheme(+localStorage.getItem('tars_theme') || 0);

async function loadCharacters() {
  try {
    const data = await (await fetch('/api/characters')).json();
    const sel = document.getElementById('character');
    sel.innerHTML = (data.available || []).map(c =>
      `<option value="${c}" ${c === data.active ? 'selected' : ''}>${c.toUpperCase()}</option>`).join('');
  } catch {}
}
async function setCharacter() {
  const name = document.getElementById('character').value;
  const r = await fetch('/api/characters', {method:'POST', headers:{'Content-Type':'application/json'},
                                            body: JSON.stringify({name})});
  if (r.ok) loadSettings();
}

async function poll() {
  try {
    const res = await fetch('/api/status');
    if (res.status === 401) { await doLogin(); return; }
    const st = await res.json();
    let line = (st.sim ? 'SIM MODE · ' : '') + 'voice: ' + st.voice;
    if (st.battery_pct !== null && st.battery_pct !== undefined) line += ' · 🔋 ' + st.battery_pct + '%';
    if (st.cpu_temp !== null && st.cpu_temp !== undefined) line += ' · ' + st.cpu_temp + '°C';
    document.getElementById('status').textContent = line;
  } catch { document.getElementById('status').textContent = 'offline'; }
}
loadSettings(); poll(); loadFacts(); loadCharacters(); loadTraining(); loadHistory(); loadCalKeys();
setInterval(poll, 3000); setInterval(loadFacts, 10000); setInterval(loadTraining, 10000);
</script>
</body>
</html>
