name: Release

# One-click releases: Actions tab -> Release -> Run workflow -> version.
# Creates the tag and the GitHub Release with notes taken from CHANGELOG.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.8.0) - must match a CHANGELOG section"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the version matches the package
        run: |
          grep -q "__version__ = \"${{ inputs.version }}\"" tars/__init__.py \
            || { echo "tars/__init__.py is not at ${{ inputs.version }}"; exit 1; }
      - name: Extract changelog section
        run: |
          awk '/^## ${{ inputs.version }} /{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for ${{ inputs.version }}"; exit 1; }
          cat notes.md
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --target "${{ github.sha }}" \
            --title "TarsGPT ${{ inputs.version }}" \
            --notes-file notes.md
